<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="1000" height="70" fill="#1e293b"/>
  <text x="30" y="42" fill="#f8fafc" font-size="22" font-weight="700">Retail Sales &amp; Product Performance Analytics</text>
  <text x="720" y="42" fill="#94a3b8" font-size="14" font-weight="500">Executive Performance Overview</text>
  
  <!-- KPI Cards -->
  <!-- Card 1: Revenue -->
  <rect x="30" y="90" width="215" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="50" y="120" fill="#94a3b8" font-size="13" font-weight="600">TOTAL REVENUE</text>
  <text x="50" y="155" fill="#f8fafc" font-size="26" font-weight="700">$124,500</text>
  <text x="160" y="155" fill="#10b981" font-size="13" font-weight="600">▲ +14.2%</text>

  <!-- Card 2: Profit -->
  <rect x="270" y="90" width="215" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="290" y="120" fill="#94a3b8" font-size="13" font-weight="600">TOTAL PROFIT</text>
  <text x="290" y="155" fill="#f8fafc" font-size="26" font-weight="700">$48,200</text>
  <text x="400" y="155" fill="#10b981" font-size="13" font-weight="600">▲ +8.7%</text>

  <!-- Card 3: Units Sold -->
  <rect x="510" y="90" width="215" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="530" y="120" fill="#94a3b8" font-size="13" font-weight="600">UNITS SOLD</text>
  <text x="530" y="155" fill="#f8fafc" font-size="26" font-weight="700">3,420</text>
  <text x="635" y="155" fill="#10b981" font-size="13" font-weight="600">▲ +5.3%</text>

  <!-- Card 4: Profit Margin -->
  <rect x="755" y="90" width="215" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="775" y="120" fill="#94a3b8" font-size="13" font-weight="600">AVG MARGIN</text>
  <text x="775" y="155" fill="#38bdf8" font-size="26" font-weight="700">38.7%</text>
  <text x="880" y="155" fill="#10b981" font-size="13" font-weight="600">High</text>

  <!-- Main Charts Section -->
  <!-- Revenue Trend Line Chart -->
  <rect x="30" y="215" width="570" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="50" y="245" fill="#f8fafc" font-size="15" font-weight="600">Monthly Revenue &amp; Profit Trend</text>
  
  <!-- Line Chart Grid Lines -->
  <line x1="60" y1="280" x2="570" y2="280" stroke="#334155" stroke-dasharray="4"/>
  <line x1="60" y1="330" x2="570" y2="330" stroke="#334155" stroke-dasharray="4"/>
  <line x1="60" y1="380" x2="570" y2="380" stroke="#334155" stroke-dasharray="4"/>
  
  <!-- Line Path -->
  <path d="M 80 370 L 170 320 L 260 340 L 350 270 L 440 290 L 530 245" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <!-- Area fill -->
  <path d="M 80 370 L 170 320 L 260 340 L 350 270 L 440 290 L 530 245 L 530 400 L 80 400 Z" fill="#38bdf8" fill-opacity="0.1"/>
  
  <!-- X Axis Labels -->
  <text x="75" y="415" fill="#64748b" font-size="12">Jan</text>
  <text x="165" y="415" fill="#64748b" font-size="12">Feb</text>
  <text x="255" y="415" fill="#64748b" font-size="12">Mar</text>
  <text x="345" y="415" fill="#64748b" font-size="12">Apr</text>
  <text x="435" y="415" fill="#64748b" font-size="12">May</text>
  <text x="525" y="415" fill="#64748b" font-size="12">Jun</text>

  <!-- Category Bar Chart -->
  <rect x="620" y="215" width="350" height="230" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="640" y="245" fill="#f8fafc" font-size="15" font-weight="600">Revenue by Category</text>
  
  <!-- Bars -->
  <text x="640" y="280" fill="#94a3b8" font-size="12">Electronics</text>
  <rect x="730" y="268" width="210" height="16" rx="4" fill="#6366f1"/>
  
  <text x="640" y="320" fill="#94a3b8" font-size="12">Clothing</text>
  <rect x="730" y="308" width="160" height="16" rx="4" fill="#6366f1"/>
  
  <text x="640" y="360" fill="#94a3b8" font-size="12">Home Goods</text>
  <rect x="730" y="348" width="110" height="16" rx="4" fill="#6366f1"/>
  
  <text x="640" y="400" fill="#94a3b8" font-size="12">Footwear</text>
  <rect x="730" y="388" width="70" height="16" rx="4" fill="#6366f1"/>

  <!-- Regional Breakdown -->
  <rect x="30" y="465" width="460" height="155" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="50" y="495" fill="#f8fafc" font-size="15" font-weight="600">Regional Profit Share</text>
  
  <rect x="50" y="520" width="180" height="12" rx="3" fill="#10b981"/>
  <text x="240" y="531" fill="#94a3b8" font-size="12">North Region (42%)</text>
  
  <rect x="50" y="545" width="130" height="12" rx="3" fill="#38bdf8"/>
  <text x="240" y="556" fill="#94a3b8" font-size="12">East Region (30%)</text>

  <rect x="50" y="570" width="80" height="12" rx="3" fill="#f59e0b"/>
  <text x="240" y="581" fill="#94a3b8" font-size="12">West Region (18%)</text>

  <!-- Top Products Table -->
  <rect x="510" y="465" width="460" height="155" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="530" y="495" fill="#f8fafc" font-size="15" font-weight="600">Top Performing Products</text>
  
  <text x="530" y="530" fill="#cbd5e1" font-size="13">1. Wireless Headphones</text>
  <text x="850" y="530" fill="#10b981" font-size="12" font-weight="600">High Margin</text>
  
  <text x="530" y="560" fill="#cbd5e1" font-size="13">2. Ergonomic Keyboard</text>
  <text x="850" y="560" fill="#38bdf8" font-size="12" font-weight="600">Volume Driver</text>

  <text x="530" y="590" fill="#cbd5e1" font-size="13">3. Cotton T-Shirt / Jacket</text>
  <text x="850" y="590" fill="#10b981" font-size="12" font-weight="600">High Margin</text>
</svg>
